name: Check official source changes
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore prior successful source hashes
        uses: actions/cache/restore@v4
        with:
          path: data/source-monitor.json
          key: official-source-monitor-v1-${{ github.run_id }}
          restore-keys: official-source-monitor-v1-
      - name: Run scheduled official URL checks
        id: monitor
        run: python3 scripts/monitor_sources.py
      - name: Save successful hashes for the next run
        uses: actions/cache/save@v4
        with:
          path: data/source-monitor.json
          key: official-source-monitor-v1-${{ github.run_id }}
      - name: Alert on changed sources
        if: steps.monitor.outputs.changed_count != '0'
        uses: actions/github-script@v7
        env:
          CHANGED_SOURCES: ${{ steps.monitor.outputs.changed_sources }}
        with:
          script: |
            const ids = JSON.parse(process.env.CHANGED_SOURCES || '[]');
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('data/source-monitor.json', 'utf8'));
            const changed = report.sources.filter(s => ids.includes(s.id));
            const title = 'Official source changes need review';
            const body = `Daily source monitoring detected changed official responses at ${report.last_checked}. A hash change is a review flag, not confirmation that displayed tournament facts changed.\n\n` + changed.map(s => `- **${s.label}** ([official source](${s.url})) — previous SHA-256: \`${s.previous_sha256}\`; current: \`${s.sha256}\`.`).join('\n') + '\n\nReview the exact page and update affected rows only after verifying the value. Live report: https://karagemop466-tech.github.io/Poker2/source-monitor.html';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner, repo, title, body, labels: ['source-review'] }).catch(async e => {
              if (String(e.message).includes('Validation Failed')) return github.rest.issues.create({ owner, repo, title, body });
              throw e;
            });
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site with this run's monitoring report
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site and monitoring report
        id: deployment
        uses: actions/deploy-pages@v4
