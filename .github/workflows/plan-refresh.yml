name: "Plan: daily official-source refresh"

# Re-reads every official URL the site is built from, records a dated snapshot, and either
# commits the snapshots (nothing moved) or opens a pull request (something moved that the
# planner depends on). It never edits event or hotel values itself: those are transcribed by
# scripts/build-events.py from the cited structure sheet, so a change becomes a human review.

on:
  schedule:
    - cron: "30 6 * * *"   # daily, 06:30 UTC
  workflow_dispatch: {}     # run it by hand the morning you pay for anything

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every official source (hash + tracked values)
        run: |
          # The self-test runs the tracked patterns from site-data/sources.json against text that
          # contains the sentences they must match, so a broken pattern fails here instead of
          # reporting "no change" forever.
          node scripts/check_sources.mjs --selftest
          node scripts/check_sources.mjs

      - name: Scrape the schedule page and diff it against the dataset
        run: node scripts/scrape-schedule.mjs

      - name: Verify the generators still reproduce every dataset and page
        run: |
          # Non-blocking on purpose: when an official page changes, the transcriptions in
          # scripts/build-events.py stop matching, and that is exactly the situation we want
          # reported as a pull request rather than a red X with no artefacts.
          #
          # (This block used to be written as `{ cmd \n && cmd ; }`, which is a bash syntax
          # error - a newline before `&&` terminates the command - so the step died with exit 2
          # on every run and the commit/PR step below was always skipped. Runs 43943838443 and
          # 44124782058 both failed this way; see COORDINATION.md, session arena/594db405-poker2.)
          set +e
          {
            python3 scripts/build-events.py --check \
              && python3 scripts/build-schedule.py --check \
              && python3 scripts/build-walk.py --check \
              && python3 scripts/build-site.py --check \
              && node scripts/scrape-schedule.mjs --selftest
          } > /tmp/verify.log 2>&1
          verify_status=$?
          set -e
          cat /tmp/verify.log
          if [ "$verify_status" -ne 0 ]; then
            echo failed > /tmp/verify.failed
            echo "GENERATOR CHECK FAILED: official text no longer matches the transcription - opening a review PR"
          fi

      - name: Commit snapshots, or open a review PR when a source moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/commit-refresh.sh
