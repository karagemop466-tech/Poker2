name: "Plan: daily official-source refresh"

# Re-reads every official URL the site is built from, records a dated snapshot, and either
# commits the snapshots (nothing moved) or opens a pull request (something moved that the
# planner depends on). It never edits event or hotel values itself: those are transcribed by
# scripts/build-events.py from the cited structure sheet, so a change becomes a human review.

on:
  schedule:
    - cron: "30 6 * * *"   # daily, 06:30 UTC
  workflow_dispatch: {}     # run it by hand the morning you pay for anything

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove the committed pages match the committed data (clean checkout, before any fetch)
        run: |
          # Runs before anything is fetched on purpose. check_plan_fresh.py below re-checks
          # reproducibility *after* this job has rendered, so a page that was hand-edited (or a
          # dataset committed without its pages) would be silently overwritten by this job's own
          # render step and pushed as if it were intended. On the clean tree there is nothing to
          # blame but the last commit, so this is where that drift is visible. Non-blocking: the
          # outcome is carried into scripts/commit-refresh.sh, which opens a review PR instead of
          # ending the run with no artefacts.
          rc=0
          { python3 scripts/build-events.py --check \
            && python3 scripts/build-schedule.py --check \
            && python3 scripts/build-walk.py --check \
            && python3 scripts/build-site.py --check \
            && python3 scripts/check_plan_fresh.py --strict ; } > /tmp/pristine.log 2>&1 || rc=$?
          cat /tmp/pristine.log
          {
            echo "## Clean-checkout reproducibility (before any fetch)"
            echo
            echo '```'
            cat /tmp/pristine.log
            echo '```'
            if [ "$rc" -ne 0 ]; then
              echo
              echo "**exit $rc** - main's committed pages do not reproduce from main's committed data. " \
                   "This job's render step will regenerate them, so review the diff in the pull request " \
                   "rather than assuming the previous commit was right."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo failed >> /tmp/verify.failed
            echo "::warning title=Committed output not reproducible::plan/** does not reproduce from site-data on a clean checkout"
          fi
          exit 0

      - name: Check every official source (hash + tracked values)
        run: |
          # The self-test runs the tracked patterns from site-data/sources.json against text that
          # contains the sentences they must match, so a broken pattern fails here instead of
          # reporting "no change" forever.
          node scripts/check_sources.mjs --selftest
          node scripts/check_sources.mjs

      - name: Scrape the schedule page and diff it against the dataset
        run: node scripts/scrape-schedule.mjs

      - name: Re-render plan/ from the datasets (never from the live fetch)
        run: |
          # The two steps above append to site-data/change-report.json and
          # site-data/schedule-diff.json, which plan/flagged.html renders. Re-rendering here
          # means the published page always reflects the run that just happened instead of the
          # last committed one. This step used to be the job's own failure: the post-fetch
          # check ran `build-site.py --check` *before* any re-render, so on every day the
          # re-check wrote a result the page differed and the whole job went red
          # (run 44124782058, main b832ae2). The check below is the honest version.
          python3 scripts/build-site.py

      - name: Verify the generators still reproduce every dataset and page
        run: |
          # Non-blocking on purpose: when an official page changes, the transcriptions in
          # scripts/build-events.py stop matching, and that is exactly the situation we want
          # reported as a pull request rather than a red X with no artefacts.
          # `--check` on build-events/build-schedule/build-walk still tells us whether the
          # transcriptions still match; build-site is checked by the freshness gate below,
          # which compares against the tree *after* this run's own re-render.
          #
          # (This block used to be written as `{ cmd \n && cmd ; }` - a bash syntax error,
          # because a newline before `&&` terminates the command - so the step died with
          # exit 2 on every run (43943838443, 44124782058) and every later step was skipped.
          # Re-verified on bash 5.2 with a minimal script file; see COORDINATION.md,
          # session arena/594db405-poker2. Runs 43943838443 / 44124782058 also predate
          # the re-render step below, so the drift fix and the syntax fix are both needed.)
          set +e
          {
            python3 scripts/build-events.py --check \
              && python3 scripts/build-schedule.py --check \
              && python3 scripts/build-walk.py --check \
              && node scripts/scrape-schedule.mjs --selftest
          } > /tmp/verify.log 2>&1
          verify_status=$?
          set -e
          cat /tmp/verify.log
          if [ "$verify_status" -ne 0 ]; then
            echo failed > /tmp/verify.failed
          fi
          cat /tmp/verify.log /tmp/pristine.log 2>/dev/null > /tmp/verify.all || true
          if [ -f /tmp/verify.failed ]; then
            echo "GENERATOR CHECK FAILED: official text no longer matches the transcription (or the " \
                 "committed pages were already unreproducible) - opening a review PR"
          fi
          true

      - name: Plan pages reproduce from the datasets and the reports are well-formed
        run: python3 scripts/check_plan_fresh.py

      - name: Commit snapshots, or open a review PR when a source moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/commit-refresh.sh
