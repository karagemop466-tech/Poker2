name: "Plan: daily official-source refresh"

# Re-reads every official URL the site is built from, records a dated snapshot, and either
# commits the snapshots (nothing moved) or opens a pull request (something moved that the
# planner depends on). It never edits event or hotel values itself: those are transcribed by
# scripts/build-events.py from the cited structure sheet, so a change becomes a human review.

on:
  schedule:
    - cron: "30 6 * * *"   # daily, 06:30 UTC
  workflow_dispatch: {}     # run it by hand the morning you pay for anything

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove the committed pages reproduce from the committed data
        run: |
          # This runs FIRST, before anything is fetched, and that ordering is the fix for a job that
          # was red on every scheduled run (43943838443, 44124782058) while passing every local rerun.
          # The generator check reads site-data/change-report.json and site-data/schedule-diff.json -
          # the reports the fetch steps below are about to write. As long as the check ran after them,
          # it compared committed pages with reports git has never held, so "the committed output
          # differs" was guaranteed and the job died before its commit step could publish the very
          # review PR the failure was meant to open. scripts/build-site.py now also refuses to certify
          # a page fed by an uncommitted input, so the class of bug cannot come back quietly.
          #
          # Still non-blocking on purpose: when an official page changes, the transcriptions in
          # scripts/build-events.py stop matching, and that is reviewable information, not a reason to
          # lose the artefacts. The outcome is written to the step summary and carried into the commit
          # step, which turns it into a pull request.
          rc=0
          { python3 scripts/build-events.py --check
            && python3 scripts/build-schedule.py --check
            && python3 scripts/build-walk.py --check
            && python3 scripts/build-site.py --check
            && node scripts/scrape-schedule.mjs --selftest
            && node scripts/check_sources.mjs --selftest ; } > /tmp/verify.log 2>&1 || rc=$?
          cat /tmp/verify.log
          {
            echo "## Generator drift check (clean checkout, before any fetch)"
            echo
            echo '```'
            cat /tmp/verify.log
            echo '```'
            if [ "$rc" -ne 0 ]; then
              echo
              echo "**exit $rc** - a transcription no longer reproduces the committed output. " \
                   "Read the cited official document, update \`scripts/build-events.py\`, and re-run the generators. " \
                   "A review pull request is opened below; the site keeps showing the last verified values until then."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo failed > /tmp/verify.failed
            echo "::warning title=Generator drift::committed /plan/ pages differ from site-data (exit $rc) - opening a review PR"
          fi
          exit 0

      - name: Check every official source (hash + tracked values)
        run: |
          # The self-test runs the tracked patterns from site-data/sources.json against text that
          # contains the sentences they must match, so a broken pattern fails here instead of
          # reporting "no change" forever.
          node scripts/check_sources.mjs --selftest
          node scripts/check_sources.mjs

      - name: Scrape the schedule page and diff it against the dataset
        run: node scripts/scrape-schedule.mjs

      - name: Render the new reports into the /plan/ pages
        run: |
          # The change-monitor table on plan/flagged.html and the `changes` array in
          # plan/assets/data.js are views of the reports the two steps above just wrote. Regenerate
          # them here so whatever this run commits is self-consistent, then re-run the check to prove it.
          python3 scripts/build-site.py
          python3 scripts/build-site.py --check
          python3 scripts/build-events.py --check

      - name: Commit snapshots, or open a review PR when a source moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/commit-refresh.sh
