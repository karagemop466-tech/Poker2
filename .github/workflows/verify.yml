name: Verify site

# This repository publishes two independent surfaces, each with its own generator and dataset:
#   * the site root  — scripts/build_master.py and scripts/build_site.py (and, for the
#                      /plan/ tree, scripts/build.py), owned by the earlier parallel sessions;
#   * /2026/         — scripts/build2026.py, the consolidated DeepStack Extravaganza IV surface.
# Both are verified here. Each surface is only ever compared against its own generator, because the
# two do not share a dataset and one generator must not be used to judge the other's output.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------- root surface (owned by the earlier sessions) ----------------
      - name: Audit every row against the official document it cites
        run: python3 scripts/audit.py

      - name: Build
        run: python3 scripts/build.py

      - name: Restore integration-owned dashboard pages (file ownership — see COORDINATION.md)
        run: |
          # scripts/build.py regenerates a site that shares some root filenames with the
          # integration dashboard built by scripts/build_site.py from a different dataset.
          # Ownership: this step validates the build.py-owned outputs, then restores the pages
          # that belong to the other generator, so the drift check below reports drift only in
          # files build.py actually owns.
          git checkout -- \
            index.html tournaments.html hotels.html planner.html planning.html \
            ranking.html rules.html monitor.html flagged.html questions.html \
            suggestions.html summary.html repo-review.html \
            venue-venetian.html venue-wynn.html venue-others.html || true

      - name: No broken internal links, no non-official external hosts
        run: python3 scripts/check_links.py

      - name: Generated pages are committed and up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run scripts/build.py and commit."
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Generated output matches the committed dataset."

      # ---------------- /2026/ surface (this integration branch) ----------------
      - name: Every /2026/ page reproduces exactly from the verified data
        run: python3 scripts/build2026.py --check

      - name: /2026/ internal links resolve and external hosts are official
        run: python3 scripts/check2026.py

      - name: /2026/ dataset invariants
        run: |
          python3 - <<'PY'
          import json, re
          d = json.load(open("data/verified2026/dataset.json"))
          ev = d["events"]
          assert len(ev) == 64, "expected 64 events, got %d" % len(ev)
          assert d["counts"]["sheets_read"] == 37, d["counts"]
          assert d["counts"]["confirmed_single_entry"] == 0, "no sheet states a one-entry rule"
          hosts = {"www.venetianlasvegas.com"}
          for e in ev:
              u = e["sheet_url"]
              assert u and re.sub(r"^https?://", "", u).split("/")[0] in hosts, e["event_no"]
          covered = {x for s in d["sheets"] for x in s["events"]}
          missing = [e["event_no"] for e in ev if e["event_no"] not in covered]
          assert not missing, "events with no sheet read: %s" % missing
          print("64 events, 37 sheets, all covered, all citations official")
          print({g: sum(1 for e in ev if e["group"] == g)
                 for g in sorted({e["group"] for e in ev})})
          PY

      - name: Regenerating /2026/ leaves no diff
        run: |
          python3 scripts/build2026.py
          if [ -n "$(git status --porcelain -- 2026 data/verified2026/dataset.json)" ]; then
            echo "::error::Committed /2026/ output differs from the verified data. Run scripts/build2026.py and commit."
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Committed /2026/ output reproduces from the verified data."
