name: Source monitor

# Cron activates once this file lands on the default branch (GitHub Pages).
on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC = 08:00 America/Los_Angeles (poker room mornings)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-check official sources
        run: python3 scripts/monitor_sources.py
      - name: Commit updated monitor data
        run: |
          git config user.name "source-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/site/monitor.json data/site/monitor-log.json
          git diff --cached --quiet || git commit -m "monitor: daily source re-check [skip ci]"
          git push
