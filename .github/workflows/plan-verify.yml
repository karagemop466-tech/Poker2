name: "Plan: generated pages match their data"

# The /plan/ surface is a generated artefact. This job proves it: every generator is re-run and the
# job fails if the committed pages differ from what site-data/*.json produces, which is what stops a
# table on the site from drifting away from the official excerpts transcribed in scripts/build-events.py.
#
# Scope note (file ownership, see COORDINATION.md): the root dashboard is generated by
# scripts/build_site.py and is checked by .github/workflows/verify.yml. This job only touches
# plan/**, site-data/** and the scripts listed below, so the two surfaces cannot fight over a file.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the datasets and the pages
        run: |
          python3 scripts/build-events.py
          python3 scripts/build-schedule.py
          python3 scripts/build-walk.py
          python3 scripts/build-site.py
      - name: Fail if the committed output differs
        run: |
          # Only the *published* inputs are compared here. change-report.json,
          # schedule-diff.json and snapshots/** are the output of the scheduled re-check, not
          # dataset inputs; including them made this gate fail on any branch that carried a
          # real re-check report. The gate below re-renders from whatever inputs are present
          # and fails if plan/** does not reproduce from them.
          git add -A -- plan site-data
          git diff --cached --quiet -- plan site-data -- \
            ':(exclude)site-data/change-report.json' \
            ':(exclude)site-data/schedule-diff.json' \
            ':(exclude)site-data/snapshots/**' || {
            echo "::error::site-data/*.json (the published dataset) differs from what is committed - run scripts/build-events.py, build-schedule.py and build-site.py, then commit"; exit 1; }
          python3 scripts/build-site.py
          python3 scripts/check_plan_fresh.py --strict
      - name: Refresh self-tests and site integrity checks
        run: |
          node scripts/scrape-schedule.mjs --selftest
          node scripts/check_sources.mjs --selftest   # exercises the patterns in site-data/sources.json
          node scripts/check_site.mjs
