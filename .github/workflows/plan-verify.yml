name: "Plan: generated pages match their data"

# The /plan/ surface is a generated artefact. This job proves it: every generator is re-run and the
# job fails if the committed pages differ from what site-data/*.json produces, which is what stops a
# table on the site from drifting away from the official excerpts transcribed in scripts/build-events.py.
#
# Scope note (file ownership, see COORDINATION.md): the root dashboard is generated by
# scripts/build_site.py and is checked by .github/workflows/verify.yml. This job only touches
# plan/**, site-data/** and the scripts listed below, so the two surfaces cannot fight over a file.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the datasets and the pages
        run: |
          python3 scripts/build-events.py
          python3 scripts/build-schedule.py
          python3 scripts/build-site.py
      - name: Fail if the committed output differs
        run: |
          git add -A -- plan site-data
          git diff --cached --quiet -- plan site-data || {
            echo "::error::plan/** differs from site-data/*.json - run scripts/build-events.py, build-schedule.py and build-site.py, then commit"; exit 1; }
      - name: Schedule parser self-test and site integrity checks
        run: |
          node scripts/scrape-schedule.mjs --selftest
          node scripts/check_site.mjs
