name: Re-check official sources

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-check every official URL
        run: python3 scripts/recheck_sources.py
      - name: Summarise changes
        run: |
          python3 - <<'EOF'
          import json, os
          p = "data/site/checks.json"
          d = json.load(open(p))
          print("::notice title=Source monitor::%d URLs, %d changed, %d errors in the latest run"
                % (d["monitored"], d["changed_this_run"], d["errors"]))
          run = d["runs"][0]
          changed = [r for r in run["results"] if r.get("change") == "CHANGED"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write("# Official source re-check\n\n")
              f.write("Run: %s\n\n" % run["checked"])
              f.write("| Source | Status | Change |\n|---|---|---|\n")
              for r in run["results"]:
                  f.write("| %s | %s | %s |\n" % (r["key"], r.get("status"), r.get("change")))
              f.write("\n%d changed this run.\n" % len(changed))
          if changed:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("changed=%d\n" % len(changed))
          EOF
        id: summary
      - name: Rebuild the site against the fresh data
        run: |
          python3 scripts/build.py
          python3 scripts/check_links.py
      - name: Commit the dated check log and any rebuilt pages
        run: |
          git config user.name  "source-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/site/checks.json
          git diff --cached --quiet || git commit -m "chore: scheduled official-source re-check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
