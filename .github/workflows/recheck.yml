name: Re-check official sources

# Re-fetches every official URL the site is built from, hashes the content, and records a dated
# snapshot. A changed hash is reported, never guessed at: the site shows you which cited value may
# have moved so you can re-read it. This job never rewrites a table row.
on:
  schedule:
    - cron: "0 15 * * *"   # daily, 07:00 PST / 08:00 PDT in Las Vegas
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: recheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-check every official URL
        run: python3 scripts/recheck2026.py

      - name: Summarise changes
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os
          d = json.load(open("data/verified2026/checks.json"))
          print("::notice title=Source monitor::%d URLs, %d changed, %d errors in the latest run"
                % (d["monitored"], d["changed_this_run"], d["errors"]))
          run = d["runs"][0]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write("# Official source re-check\n\nRun: %s\n\n" % run["checked"])
              f.write("| Source | Status | Change |\n|---|---|---|\n")
              for r in run["results"]:
                  f.write("| %s | %s | %s |\n" % (r["key"], r.get("status"), r.get("change")))
              f.write("\n%d changed this run.\n" % d["changed_this_run"])
          if d["changed_this_run"]:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("changed=%d\n" % d["changed_this_run"])
          EOF

      - name: Rebuild the site and verify it
        run: |
          python3 scripts/build2026.py
          python3 scripts/check2026.py

      - name: Preserve the dated monitor report
        uses: actions/upload-artifact@v4
        with:
          name: official-source-recheck
          path: data/verified2026/checks.json
          if-no-files-found: error

      # Do not rebase generated evidence onto a moving main. An overlapping release may
      # have changed the evidence registry or the generator. The artifact survives a race.
      - name: Publish the report and regenerated pages to main
        id: publish
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "source-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/verified2026/{checks,dataset,search-index}.json 2026
          if git diff --cached --quiet; then
            echo "No change since the last recorded run."
            exit 0
          fi
          git commit -m "chore: scheduled official-source re-check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:refs/heads/main
          echo "published=true" >> "$GITHUB_OUTPUT"

      # A branch-source Pages build is not triggered by a push made with GITHUB_TOKEN.
      - name: Request a Pages build for the refreshed report
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
