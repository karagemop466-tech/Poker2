name: Re-check official sources

# Re-fetches every official URL the site is built from, hashes the content, and records a dated
# snapshot. A changed hash is reported, never guessed at: the site shows you which cited value may
# have moved so you can re-read it. This job never rewrites a table row.
on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC (23:00 Las Vegas)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-check every official URL
        run: python3 scripts/recheck2026.py

      - name: Summarise changes
        id: summary
        run: |
          python3 - <<'EOF'
          import json, os
          d = json.load(open("data/verified2026/checks.json"))
          print("::notice title=Source monitor::%d URLs, %d changed, %d errors in the latest run"
                % (d["monitored"], d["changed_this_run"], d["errors"]))
          run = d["runs"][0]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write("# Official source re-check\n\nRun: %s\n\n" % run["checked"])
              f.write("| Source | Status | Change |\n|---|---|---|\n")
              for r in run["results"]:
                  f.write("| %s | %s | %s |\n" % (r["key"], r.get("status"), r.get("change")))
              f.write("\n%d changed this run.\n" % d["changed_this_run"])
          if d["changed_this_run"]:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("changed=%d\n" % d["changed_this_run"])
          EOF

      - name: Rebuild the site and verify it
        run: |
          python3 scripts/build2026.py
          python3 scripts/check2026.py

      - name: Commit the dated check log
        run: |
          git config user.name  "source-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/verified2026/checks.json
          git diff --cached --quiet || git commit -m "chore: scheduled official-source re-check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
